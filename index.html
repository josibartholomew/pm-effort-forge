<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Effort Calculator</title>
<style>
  :root {
    --primary-red: #DB0000; /* SUU Official Red */
    --dark-red: #990000;
    --black: #000000;
    --dark-gray: #333333;
    --light-gray: #f4f4f4;
    --border-color: #dddddd;
    --white: #ffffff;
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: var(--light-gray); 
    color: var(--black);
    margin: 0; 
    padding: 20px; 
    line-height: 1.5;
  }

  /* Expanded Container for Wider View */
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Header & Logo */
  .app-header {
    display: flex;
    align-items: center;
    background-color: var(--white);
    padding: 20px 30px;
    border-top: 5px solid var(--primary-red);
    border-radius: 8px 8px 0 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .logo-container {
    margin-right: 24px;
    padding-right: 24px;
    border-right: 2px solid var(--light-gray);
  }

  .logo-container img {
    max-height: 60px;
    width: auto;
    display: block;
  }

  .title-container h1 {
    margin: 0;
    font-size: 1.8rem;
    color: var(--black);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #status { 
    margin: 4px 0 0 0;
    color: var(--dark-gray); 
    font-size: 0.9em;
    font-weight: 500;
  }

  /* Tab Navigation */
  .tab-nav {
    display: flex;
    background-color: var(--black);
    border-radius: 0 0 8px 8px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .tab-button {
    background: none;
    border: none;
    color: var(--white);
    padding: 14px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
    border-bottom: 4px solid transparent;
    border-radius: 0;
  }

  .tab-button:hover {
    background-color: #222222;
  }

  .tab-button.active {
    background-color: var(--white);
    color: var(--primary-red);
    border-bottom: 4px solid var(--primary-red);
  }

  /* Tab Panels */
  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  /* Layout Cards */
  section { 
    background: var(--white); 
    border-radius: 8px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    padding: 24px 30px; 
    margin-bottom: 24px; 
  }

  h2 { 
    color: var(--primary-red); 
    border-bottom: 2px solid var(--light-gray); 
    padding-bottom: 10px; 
    margin-top: 0; 
    font-size: 1.4rem;
  }

  /* Mobile Responsive Table Wrapper */
  .table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 15px;
  }

  /* Tables */
  table { 
    border-collapse: collapse; 
    width: 100%; 
  }
  
  td, th { 
    border-bottom: 1px solid var(--border-color); 
    padding: 12px 10px; 
    text-align: left; 
    vertical-align: top; 
  }

  th {
    background-color: var(--black);
    color: var(--white);
    text-transform: uppercase;
    font-size: 0.85em;
    letter-spacing: 0.5px;
    border: none;
  }

  tr:hover td {
    background-color: #fcfcfc;
  }

  /* Form Elements */
  input[type=number], input[type=text], select { 
    width: 100%; 
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.95em;
    transition: border-color 0.2s, outline 0.2s;
  }

  input[type=number]:focus, input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--primary-red);
  }

  /* High-Contrast Keyboard Focus Rings */
  button:focus-visible, 
  input:focus-visible, 
  select:focus-visible {
    outline: 3px solid var(--black);
    outline-offset: 2px;
    border-color: var(--primary-red);
  }

  .activity-desc { 
    color: #555555; 
    font-size: 0.88em; 
    display: block; 
    margin-top: 4px; 
    line-height: 1.45;
  }

  /* Buttons */
  button {
    background-color: var(--primary-red);
    color: var(--white);
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    font-size: 0.95rem;
  }

  button:hover {
    background-color: var(--dark-red);
  }

  button:active {
    transform: scale(0.98);
  }

  .btn-secondary {
    background-color: var(--dark-gray);
  }

  .btn-secondary:hover {
    background-color: var(--black);
  }

  .button-group {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }

  .input-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
    background: var(--light-gray);
    padding: 15px;
    border-radius: 6px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
  }

  .input-group label {
    font-size: 0.85em;
    font-weight: 600;
    color: var(--dark-gray);
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .tooltip-icon {
    cursor: help;
    text-decoration: underline dotted;
    margin-left: 4px;
    font-size: 0.85em;
  }
</style>
</head>
<body>

<div class="container">
  <header class="app-header">
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1cIvth3YfwxjgPgVF5PqcQYOwZnlRCPWJ" alt="Southern Utah University Logo">
    </div>
    <div class="title-container">
      <h1>PM Effort Calculator</h1>
      <p id="status" aria-live="polite">Loading...</p>
    </div>
  </header>

  <nav class="tab-nav" role="tablist" aria-label="Main Navigation">
    <button class="tab-button active" role="tab" aria-selected="true" aria-controls="tab-calculator" id="btn-tab-calculator" onclick="switchTab('tab-calculator', this)">Effort Calculator</button>
    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-saved" id="btn-tab-saved" onclick="switchTab('tab-saved', this)">Saved Projects</button>
    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-admin" id="btn-tab-admin" onclick="switchTab('tab-admin', this)">Admin & Settings</button>
  </nav>

  <!-- TAB 1: CALCULATOR -->
  <div id="tab-calculator" class="tab-content active" role="tabpanel" aria-labelledby="btn-tab-calculator">
    <section>
      <h2>Project Details</h2>
      <div class="input-grid">
        <div class="input-group">
          <label for="projName">Project Name</label>
          <input id="projName" type="text" value="Test project">
        </div>
        <div class="input-group">
          <label for="projBudget">Annual Budget ($)</label>
          <input id="projBudget" type="number" value="250000">
        </div>
        <div class="input-group">
          <label for="projSubawards">Subawards</label>
          <input id="projSubawards" type="number" value="1">
        </div>
      </div>
      
      <div id="userActivities"></div>
      
      <div class="button-group">
        <button class="btn-secondary" onclick="selectAll(true)">Select All</button> 
        <button class="btn-secondary" onclick="selectAll(false)">Select None</button>
      </div>
    </section>

    <section>
      <h2>Calculated Results</h2>
      <div id="results"></div>
      <div class="button-group">
        <button onclick="saveProject()">Save Project</button>
      </div>
    </section>
  </div>

  <!-- TAB 2: SAVED PROJECTS -->
  <div id="tab-saved" class="tab-content" role="tabpanel" aria-labelledby="btn-tab-saved">
    <section>
      <h2>Saved Project Log</h2>
      <div id="savedProjects" style="margin-top: 15px; font-size: 0.95em;"></div>
    </section>
  </div>

  <!-- TAB 3: ADMIN & SETTINGS -->
  <div id="tab-admin" class="tab-content" role="tabpanel" aria-labelledby="btn-tab-admin">
    <section>
      <h2>Admin: Activity Catalog</h2>
      <div id="adminActivities"></div>
      <div class="button-group">
        <button class="btn-secondary" onclick="addActivity()">+ Add Activity</button>
      </div>
      
      <h2 style="margin-top: 30px;">Admin: Calculator Settings</h2>
      <div id="adminSettings"></div>
      
      <div class="button-group">
        <button onclick="saveAdmin()">Save Admin Changes</button>
        <button class="btn-secondary" onclick="resetDefaults()">Reset to Defaults</button>
      </div>
      
      <div id="jsonTools" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <button class="btn-secondary" onclick="exportConfig()">Export Config (JSON)</button>
        <span style="margin-left: 15px; font-weight: 500; font-size: 0.9em;">Import Config:</span> 
        <input type="file" accept=".json" onchange="importConfig(this)" style="font-size: 0.85em;" aria-label="Import configuration file">
      </div>
    </section>
  </div>
</div>

<script>
// ---------- Tab Navigation Helper ----------
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.querySelectorAll('.tab-button').forEach(tb => {
    tb.classList.remove('active');
    tb.setAttribute('aria-selected', 'false');
  });
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
}

// ---------- Defaults ----------
const DEFAULT_CONFIG = {
  settings: {
    pmWeeksPerYear: 52,        // weekly activities x this
    studentWeeksPerYear: 48,   // student hrs/wk = total hours / this
    fullTimeHours: 2080,       // FTE % = total hours / this
    subawardRate: 0.05,        // multiplier added per subaward
    budgetRatePer100k: 0.03,   // multiplier added per $100k of budget
    multiplierCap: 2           // multiplier never exceeds this
  },
  activities: [
    { 
      id: 'monitoring', 
      name: 'Monitoring project activities & workflow', 
      description: 'Tracks project workflows, maintains work plans/deliverable logs, follows up on assigned tasks, and ensures activities stay on schedule.', 
      hours: 2.5, 
      unit: 'week', 
      timesPerYear: '' 
    },
    { 
      id: 'meeting_coord', 
      name: 'Meeting coordination & facilitation', 
      description: 'Schedules and facilitates project meetings, prepares agendas, gathers status updates, and tracks action items.', 
      hours: 2.5, 
      unit: 'week', 
      timesPerYear: '' 
    },
    { 
      id: 'communication', 
      name: 'Communication & stakeholder engagement', 
      description: 'Manages internal and external communications, distributes meeting documentation, and provides routine status summaries.', 
      hours: 2, 
      unit: 'week', 
      timesPerYear: '' 
    },
    { 
      id: 'budget_monitoring', 
      name: 'Budget monitoring & oversight', 
      description: 'Provides financial oversight by tracking expenditures, reconciling budgets, coordinating with SPARC/sponsors, and supporting hiring/purchases.', 
      hours: 5.5, 
      unit: 'month', 
      timesPerYear: '' 
    },
    { 
      id: 'reporting', 
      name: 'Annual reporting & compliance', 
      description: 'Coordinates sponsor reporting by collecting data, compiling report sections, and ensuring on-time deliverable submissions.', 
      hours: 20, 
      unit: 'year', 
      timesPerYear: '' 
    },
    { 
      id: 'quarterly_report', 
      name: 'Quarterly progress report', 
      description: 'Drafts and submits quarterly progress reports, tracking sub-deliverables and sponsor-required milestones.', 
      hours: 6, 
      unit: 'each', 
      timesPerYear: 4 
    },
    { 
      id: 'doc_management', 
      name: 'Documentation & knowledge management', 
      description: 'Maintains organized shared repositories and manages file version control for project templates and records.', 
      hours: 1, 
      unit: 'week', 
      timesPerYear: '' 
    },
    { 
      id: 'risk_mgmt', 
      name: 'Risk management & issue resolution', 
      description: 'Supports proactive risk management by identifying potential roadblocks, maintaining a risk log, and resolving emerging issues.', 
      hours: 2.5, 
      unit: 'month', 
      timesPerYear: '' 
    },
    { 
      id: 'subaward_coord', 
      name: 'Partner/subaward coordination', 
      description: 'Manages external subcontracts, coordinates partner institution communication, and tracks subrecipient progress and reports.', 
      hours: 3, 
      unit: 'month', 
      timesPerYear: '' 
    },
    { 
      id: 'launch', 
      name: 'Project launch', 
      description: 'Establishes startup tracking tools, prepares kickoff meetings, and coordinates setup with SPARC Post Award.', 
      hours: 8, 
      unit: 'year', 
      timesPerYear: '' 
    },
    { 
      id: 'closeout', 
      name: 'Project closeout', 
      description: 'Oversees project closeout, ensuring final deliverables are submitted, records archived, and closeout memos completed.', 
      hours: 6, 
      unit: 'year', 
      timesPerYear: '' 
    },
    { 
      id: 'evaluation', 
      name: 'Evaluation & continuous improvement', 
      description: 'Coordinates feedback collection, assists external evaluator requests, and refines operational workflows.', 
      hours: 2.5, 
      unit: 'month', 
      timesPerYear: '' 
    }
  ]
};

// ---------- Calculation ----------
function annualHours(a, s) {
  const h = Number(a.hours) || 0;
  if (a.unit === 'week') return h * s.pmWeeksPerYear;
  if (a.unit === 'month') return h * 12;
  if (a.unit === 'each') return h * (Number(a.timesPerYear) || 0);
  return h; // year
}

function calculate(config, project) {
  const s = config.settings;
  const chosen = config.activities.filter(a => project.selected.includes(a.id));
  const baseHours = chosen.reduce((sum, a) => sum + annualHours(a, s), 0);
  const budget = Number(project.budget) || 0;
  const subawards = Number(project.subawards) || 0;

  const multiplier = Math.min(
    s.multiplierCap,
    1 + (subawards * s.subawardRate) + ((budget / 100000) * s.budgetRatePer100k)
  );
  const totalHours = baseHours * multiplier;

  return {
    baseHours,
    multiplier,
    totalHours,
    ftePercent: (totalHours / s.fullTimeHours) * 100,
    studentHoursPerWeek: totalHours / s.studentWeeksPerYear
  };
}

// ---------- Storage: Apps Script (Sheet) or browser (localStorage) ----------
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const CONFIG_KEY = 'pmEffort.config';
const PROJECTS_KEY = 'pmEffort.projects';

function gasCall(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}
function lsGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { alert('Could not save in this browser: ' + e); }
}

const store = IS_GAS ? {
  loadConfig: () => gasCall('getConfig'),
  saveConfig: c => gasCall('saveConfig', c),
  saveProject: p => gasCall('saveProject', p),
  listProjects: async () => null
} : {
  loadConfig: async () => lsGet(CONFIG_KEY),
  saveConfig: async c => lsSet(CONFIG_KEY, c),
  saveProject: async p => lsSet(PROJECTS_KEY, (lsGet(PROJECTS_KEY) || []).concat([p])),
  listProjects: async () => lsGet(PROJECTS_KEY) || []
};

// ---------- App ----------
let config = null;
let selected = [];

function copy(x) { return JSON.parse(JSON.stringify(x)); }
function esc(x) {
  return String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function setStatus(msg) { document.getElementById('status').textContent = msg; }

function normalize(c) {
  for (const k of Object.keys(DEFAULT_CONFIG.settings)) {
    const v = c.settings[k] ?? DEFAULT_CONFIG.settings[k];
    c.settings[k] = Number(v);
  }
  if (Array.isArray(c.activities)) {
    c.activities.forEach(a => {
      const def = DEFAULT_CONFIG.activities.find(d => d.id === a.id || d.name.toLowerCase() === a.name.toLowerCase());
      if (def) {
        if (!a.description) a.description = def.description;
        if (a.hours === undefined || a.hours === null || a.hours === 0) a.hours = def.hours;
      }
    });
  }
  return c;
}

async function init() {
  try {
    let c = await store.loadConfig();
    if (!c || !c.activities || !c.activities.length) {
      c = copy(DEFAULT_CONFIG);
      await store.saveConfig(c);
    }
    config = normalize(c);
    selected = config.activities.map(a => a.id);
    if (IS_GAS) document.getElementById('jsonTools').style.display = 'none';
    setStatus(IS_GAS ? 'Data synced with Google Sheet' : 'Working locally (browser storage)');
    renderAll();
    renderSaved();
  } catch (e) {
    setStatus('Error loading: ' + e);
  }
}

function currentProject() {
  return {
    name: document.getElementById('projName').value,
    budget: Number(document.getElementById('projBudget').value) || 0,
    subawards: Number(document.getElementById('projSubawards').value) || 0,
    selected: selected.slice()
  };
}

function renderAll() { renderUser(); renderAdmin(); renderResults(); }

function renderUser() {
  const s = config.settings;
  document.getElementById('userActivities').innerHTML =
    '<div class="table-wrapper"><table><tr><th scope="col" style="width: 45px; text-align: center;">✓</th><th scope="col" style="width: 60%;">Activity & Description</th><th scope="col" style="width: 25%;">Expected</th><th scope="col" style="width: 15%;">Hours/yr</th></tr>' +
    config.activities.map((a, i) => `<tr>
      <td style="text-align: center;"><input type="checkbox" aria-label="Select ${esc(a.name)}" style="transform: scale(1.3);" ${selected.includes(a.id) ? 'checked' : ''} onchange="toggle(${i}, this.checked)"></td>
      <td>
        <strong style="font-size: 1rem; color: var(--black);">${esc(a.name)}</strong>
        ${a.description ? `<span class="activity-desc">${esc(a.description)}</span>` : ''}
      </td>
      <td>${esc(a.hours)} hrs/${a.unit === 'each' ? 'each x ' + esc(a.timesPerYear) + '/yr' : esc(a.unit)}</td>
      <td style="font-weight: 600;">${annualHours(a, s).toFixed(1)}</td>
    </tr>`).join('') + '</table></div>';
}

function renderResults() {
  const r = calculate(config, currentProject());
  document.getElementById('results').innerHTML = `<div class="table-wrapper"><table>
    <tr>
      <td style="width: 70%;">
        <b>Base hours/yr</b>
        <span title="Total calculated hours before applying complexity multipliers" class="tooltip-icon">ⓘ</span>
      </td>
      <td>${r.baseHours.toFixed(1)}</td>
    </tr>
    <tr>
      <td>
        <b>Complexity multiplier</b>
        <span title="Multiplier derived from subawards and project budget" class="tooltip-icon">ⓘ</span>
      </td>
      <td>${r.multiplier.toFixed(2)}x</td>
    </tr>
    <tr style="background-color: #ffe6e6; border-top: 2px solid var(--primary-red);">
      <td style="color: var(--dark-red);"><b>Total Annualized Hours</b></td>
      <td style="color: var(--dark-red); font-size: 1.1em;"><b>${r.totalHours.toFixed(1)}</b></td>
    </tr>
    <tr>
      <td>
        <b>FTE %</b> 
        <span title="Full-Time Equivalent percentage based on ${config.settings.fullTimeHours} annual standard hours" class="tooltip-icon">ⓘ</span>
        <span style="color:#666; font-size:0.85em; font-weight:normal;">(${config.settings.fullTimeHours} hrs/yr)</span>
      </td>
      <td><b>${r.ftePercent.toFixed(1)}%</b></td>
    </tr>
    <tr>
      <td>
        <b>Hours/wk</b> 
        <span title="Weekly hours required for student worker based on ${config.settings.studentWeeksPerYear} active weeks" class="tooltip-icon">ⓘ</span>
        <span style="color:#666; font-size:0.85em; font-weight:normal;">(student, ${config.settings.studentWeeksPerYear} wks)</span>
      </td>
      <td><b>${r.studentHoursPerWeek.toFixed(1)}</b></td>
    </tr>
  </table></div>`;
}

function renderAdmin() {
  document.getElementById('adminActivities').innerHTML =
    '<div class="table-wrapper"><table><tr><th scope="col" style="width: 25%;">Activity Name</th><th scope="col" style="width: 45%;">Description</th><th scope="col" style="width: 10%;">Hours</th><th scope="col" style="width: 10%;">Per</th><th scope="col" style="width: 10%;">Times/yr</th><th scope="col"></th></tr>' +
    config.activities.map((a, i) => `<tr>
      <td><input type="text" aria-label="Activity Name" value="${esc(a.name)}" onchange="editActivity(${i}, 'name', this.value)"></td>
      <td><input type="text" aria-label="Activity Description" value="${esc(a.description || '')}" onchange="editActivity(${i}, 'description', this.value)" placeholder="Activity description"></td>
      <td><input type="number" aria-label="Activity Hours" step="0.5" value="${esc(a.hours)}" onchange="editActivity(${i}, 'hours', Number(this.value))"></td>
      <td><select aria-label="Activity Unit" onchange="editActivity(${i}, 'unit', this.value)">
        ${['week', 'month', 'year', 'each'].map(u => `<option ${a.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
      </select></td>
      <td><input type="number" aria-label="Times Per Year" value="${esc(a.timesPerYear)}" onchange="editActivity(${i}, 'timesPerYear', this.value)"></td>
      <td><button class="btn-secondary" style="padding: 6px 12px; font-size: 0.85em;" onclick="removeActivity(${i})">Delete</button></td>
    </tr>`).join('') + '</table></div>';

  document.getElementById('adminSettings').innerHTML =
    '<div class="table-wrapper"><table style="max-width: 600px;"><tr><th scope="col" style="width: 60%;">Setting</th><th scope="col" style="width: 40%;">Value</th></tr>' + Object.keys(config.settings).map(k => `<tr>
      <td style="font-weight: 500;">${k}</td>
      <td><input type="number" aria-label="${k}" value="${esc(config.settings[k])}" onchange="editSetting('${k}', this.value)" step="any"></td>
    </tr>`).join('') + '</table></div>';
}

async function renderSaved() {
  const list = await store.listProjects();
  const el = document.getElementById('savedProjects');
  if (list === null) { el.innerHTML = '<p style="color: var(--dark-gray);"><em>Note: Saved projects go directly to the <b>Projects</b> tab of your connected Google Sheet.</em></p>'; return; }
  el.innerHTML = list.length ? '<p><strong>Saved locally in this browser:</strong></p><ul style="color: var(--dark-gray); padding-left: 20px;">' + list.map(p =>
    `<li style="margin-bottom: 6px;">${esc(p.savedAt)} &mdash; <strong>${esc(p.name)}</strong>: ${p.results.totalHours.toFixed(1)} hrs, ${p.results.ftePercent.toFixed(1)}% FTE</li>`
  ).join('') + '</ul>' : '<p style="color: var(--dark-gray);">No saved projects found in local browser storage.</p>';
}

// ---------- Actions ----------
function toggle(i, on) {
  const id = config.activities[i].id;
  selected = on ? selected.concat([id]) : selected.filter(x => x !== id);
  renderResults();
}
function selectAll(on) {
  selected = on ? config.activities.map(a => a.id) : [];
  renderUser(); renderResults();
}
function editActivity(i, field, value) {
  config.activities[i][field] = value;
  renderUser(); renderResults();
}
function addActivity() {
  const id = 'a' + Date.now();
  config.activities.push({ id, name: 'New activity', description: '', hours: 1, unit: 'week', timesPerYear: '' });
  selected.push(id);
  renderAll();
}
function removeActivity(i) {
  const id = config.activities[i].id;
  config.activities.splice(i, 1);
  selected = selected.filter(x => x !== id);
  renderAll();
}
function editSetting(k, value) {
  config.settings[k] = Number(value);
  renderAll();
}

async function saveAdmin() {
  setStatus('Saving admin changes...');
  try { await store.saveConfig(config); setStatus('Admin changes saved successfully.'); }
  catch (e) { setStatus('Error saving: ' + e); }
}
async function resetDefaults() {
  if (!confirm('Replace all activities and settings with the defaults?')) return;
  config = normalize(copy(DEFAULT_CONFIG));
  selected = config.activities.map(a => a.id);
  renderAll();
  await saveAdmin();
}
async function saveProject() {
  const p = currentProject();
  const results = calculate(config, p);
  const names = config.activities.filter(a => p.selected.includes(a.id)).map(a => a.name);
  setStatus('Saving project...');
  try {
    await store.saveProject({ ...p, selectedNames: names, results, savedAt: new Date().toLocaleString() });
    setStatus('Project saved successfully.');
    renderSaved();
  } catch (e) { setStatus('Error saving project: ' + e); }
}

function exportConfig() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pm-effort-config.json';
  a.click();
}
function importConfig(input) {
  const file = input.files[0];
  if (!file) return;
  file.text().then(async text => {
    try {
      const c = JSON.parse(text);
      if (!Array.isArray(c.activities) || !c.settings) throw new Error('missing activities or settings');
      config = normalize(c);
      selected = config.activities.map(a => a.id);
      renderAll();
      await saveAdmin();
      setStatus('Config imported successfully.');
    } catch (e) { alert('Could not import: ' + e.message); }
    input.value = '';
  });
}

['projName', 'projBudget', 'projSubawards'].forEach(id =>
  document.getElementById(id).addEventListener('input', renderResults));
init();
</script>
</body>
</html>
