<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Effort Calculator</title>
<style>
  :root {
    --primary-red: #DB0000; /* SUU Official Red */
    --dark-red: #990000;
    --black: #000000;
    --dark-gray: #333333;
    --light-gray: #f4f4f4;
    --border-color: #dddddd;
    --white: #ffffff;
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: var(--light-gray); 
    color: var(--black);
    margin: 0; 
    padding: 20px; 
    line-height: 1.5;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Header & Logo */
  .app-header {
    display: flex;
    align-items: center;
    background-color: var(--white);
    padding: 20px 30px;
    border-top: 5px solid var(--primary-red);
    border-radius: 8px 8px 0 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .logo-container {
    margin-right: 24px;
    padding-right: 24px;
    border-right: 2px solid var(--light-gray);
  }

  .logo-container img {
    max-height: 60px;
    width: auto;
    display: block;
  }

  .title-container h1 {
    margin: 0;
    font-size: 1.8rem;
    color: var(--black);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #status { 
    margin: 4px 0 0 0;
    color: var(--dark-gray); 
    font-size: 0.9em;
    font-weight: 500;
  }

  /* Tab Navigation */
  .tab-nav {
    display: flex;
    background-color: var(--black);
    border-radius: 0 0 8px 8px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .tab-button {
    background: none;
    border: none;
    color: var(--white);
    padding: 14px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
    border-bottom: 4px solid transparent;
    border-radius: 0;
  }

  .tab-button:hover {
    background-color: #222222;
  }

  .tab-button.active {
    background-color: var(--white);
    color: var(--primary-red);
    border-bottom: 4px solid var(--primary-red);
  }

  /* Tab Panels */
  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  section { 
    background: var(--white); 
    border-radius: 8px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    padding: 24px 30px; 
    margin-bottom: 24px; 
  }

  h2 { 
    color: var(--primary-red); 
    border-bottom: 2px solid var(--light-gray); 
    padding-bottom: 10px; 
    margin-top: 0; 
    font-size: 1.4rem;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 15px;
  }

  .table-wrapper table {
    min-width: 650px;
  }

  table { 
    border-collapse: collapse; 
    width: 100%; 
  }
  
  td, th { 
    border-bottom: 1px solid var(--border-color); 
    padding: 12px 10px; 
    text-align: left; 
    vertical-align: top; 
  }

  th {
    background-color: var(--black);
    color: var(--white);
    text-transform: uppercase;
    font-size: 0.85em;
    letter-spacing: 0.5px;
    border: none;
  }

  tr.unselected-row {
    opacity: 0.6;
    background-color: #fafafa;
  }

  tr:hover td {
    background-color: #fcfcfc;
  }

  input[type=number], input[type=text], select { 
    width: 100%; 
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.95em;
    transition: border-color 0.2s, outline 0.2s;
  }

  input[type=number]:focus, input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--primary-red);
  }

  button:focus-visible, 
  input:focus-visible, 
  select:focus-visible {
    outline: 3px solid var(--black);
    outline-offset: 2px;
    border-color: var(--primary-red);
  }

  .activity-desc { 
    color: #555555; 
    font-size: 0.88em; 
    display: block; 
    margin-top: 4px; 
    line-height: 1.45;
  }

  button {
    background-color: var(--primary-red);
    color: var(--white);
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    font-size: 0.95rem;
  }

  button:hover {
    background-color: var(--dark-red);
  }

  button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }

  button:active:not(:disabled) {
    transform: scale(0.98);
  }

  .btn-secondary {
    background-color: var(--dark-gray);
  }

  .btn-secondary:hover {
    background-color: var(--black);
  }

  .button-group {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }

  .input-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
    background: var(--light-gray);
    padding: 15px;
    border-radius: 6px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
  }

  .input-group label {
    font-size: 0.85em;
    font-weight: 600;
    color: var(--dark-gray);
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .header-actions {
    margin-left: auto;
  }

  .source-option {
    display: block;
    margin: 8px 0;
    font-weight: 500;
  }

  .source-option input {
    margin-right: 8px;
    transform: scale(1.2);
  }

  .source-note {
    color: #666666;
    font-size: 0.85em;
    font-weight: normal;
    margin-left: 6px;
  }

  .tooltip-icon {
    cursor: help;
    text-decoration: underline dotted;
    margin-left: 4px;
    font-size: 0.85em;
  }

  /* PRINT / PDF STYLES */
  @media print {
    body {
      background-color: #ffffff !important;
      color: #000000 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .container {
      max-width: 100% !important;
      margin: 0 !important;
    }

    .tab-nav,
    .button-group,
    #jsonTools,
    #inputPanel,
    .header-actions,
    #status,
    .tab-content:not(.active),
    .tooltip-icon {
      display: none !important;
    }

    section {
      box-shadow: none !important;
      border: 1px solid #cccccc !important;
      padding: 15px 20px !important;
      margin-bottom: 15px !important;
      page-break-inside: avoid;
    }

    .app-header {
      box-shadow: none !important;
      border-top: 4px solid var(--primary-red) !important;
      padding: 10px 0 !important;
      margin-bottom: 15px !important;
      border-bottom: 2px solid var(--black) !important;
      border-radius: 0 !important;
    }

    tr.unselected-row {
      display: none !important;
    }

    .checkbox-col {
      display: none !important;
    }

    input[type=text], input[type=number] {
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      font-weight: 600 !important;
    }

    .table-wrapper table {
      min-width: 100% !important;
    }

    th {
      background-color: var(--black) !important;
      color: var(--white) !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="container">
  <header class="app-header">
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1cIvth3YfwxjgPgVF5PqcQYOwZnlRCPWJ" alt="Southern Utah University Logo">
    </div>
    <div class="title-container">
      <h1>PM Effort Calculator</h1>
      <p id="status" aria-live="polite">Loading...</p>
    </div>
    <div class="header-actions">
      <button id="btnInput" class="btn-secondary" aria-expanded="false" aria-controls="inputPanel" onclick="toggleInputPanel()">Input</button>
    </div>
  </header>

  <nav class="tab-nav" role="tablist" aria-label="Main Navigation">
    <button class="tab-button active" role="tab" aria-selected="true" aria-controls="tab-calculator" id="btn-tab-calculator" onclick="switchTab('tab-calculator', this)">Effort Calculator</button>
    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-saved" id="btn-tab-saved" onclick="switchTab('tab-saved', this)">Saved Projects</button>
    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-admin" id="btn-tab-admin" onclick="switchTab('tab-admin', this)">Admin & Settings</button>
  </nav>

  <!-- INPUT SOURCE PANEL -->
  <section id="inputPanel" hidden>
    <h2>Input Source</h2>
    <p style="margin-top: 0;">Choose where the activity catalog, descriptions, and calculator settings come from.</p>
    <label class="source-option">
      <input type="radio" name="source" value="sheet" onchange="setSource(this.value)">Connected Google Sheet
      <span id="sheetNote" class="source-note"></span>
    </label>
    <label class="source-option">
      <input type="radio" name="source" value="csv" onchange="setSource(this.value)">Uploaded CSV
      <span class="source-note">(stored in this browser only)</span>
    </label>
    <div class="button-group">
      <button class="btn-secondary" onclick="document.getElementById('csvFile').click()">Upload CSV</button>
      <button class="btn-secondary" onclick="downloadCsv()">Download CSV</button>
      <input type="file" id="csvFile" accept=".csv,text/csv" onchange="uploadCsv(this)" hidden>
    </div>
  </section>

  <!-- TAB 1: CALCULATOR -->
  <div id="tab-calculator" class="tab-content active" role="tabpanel" aria-labelledby="btn-tab-calculator">
    <section>
      <h2>Project Details</h2>
      <div class="input-grid">
        <div class="input-group">
          <label for="projName">Project Name</label>
          <input id="projName" type="text" value="Test project">
        </div>
        <div class="input-group">
          <label for="projBudget">Annual Budget ($)</label>
          <input id="projBudget" type="number" value="250000" min="0">
        </div>
        <div class="input-group">
          <label for="projSubawards">Subawards</label>
          <input id="projSubawards" type="number" value="1" min="0">
        </div>
      </div>
      
      <div id="userActivities"></div>
      
      <div class="button-group">
        <button class="btn-secondary" onclick="selectAll(true)">Select All</button> 
        <button class="btn-secondary" onclick="selectAll(false)">Select None</button>
      </div>
    </section>

    <section>
      <h2>Calculated Results</h2>
      <div id="results"></div>
      <div class="button-group">
        <button id="btnSaveProject" onclick="saveProject()">Save Project</button>
        <button class="btn-secondary" onclick="window.print()">🖨️ Print / Export PDF Summary</button>
      </div>
    </section>
  </div>

  <!-- TAB 2: SAVED PROJECTS -->
  <div id="tab-saved" class="tab-content" role="tabpanel" aria-labelledby="btn-tab-saved">
    <section>
      <h2>Saved Project Log</h2>
      <div id="savedProjects" style="margin-top: 15px; font-size: 0.95em;"></div>
    </section>
  </div>

  <!-- TAB 3: ADMIN & SETTINGS -->
  <div id="tab-admin" class="tab-content" role="tabpanel" aria-labelledby="btn-tab-admin">
    <section>
      <h2>Admin: Activity Catalog</h2>
      <div id="adminActivities"></div>
      <div class="button-group">
        <button class="btn-secondary" onclick="addActivity()">+ Add Activity</button>
      </div>
      
      <h2 style="margin-top: 30px;">Admin: Calculator Settings</h2>
      <div id="adminSettings"></div>
      
      <div class="button-group">
        <button id="btnSaveAdmin" onclick="saveAdmin()">Save Admin Changes</button>
        <button class="btn-secondary" onclick="resetDefaults()">Reset to Defaults</button>
      </div>
      
      <div id="jsonTools" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <button class="btn-secondary" onclick="exportConfig()">Export Config (JSON)</button>
        <span style="margin-left: 15px; font-weight: 500; font-size: 0.9em;">Import Config:</span> 
        <input type="file" accept=".json" onchange="importConfig(this)" style="font-size: 0.85em;" aria-label="Import configuration file">
      </div>
    </section>
  </div>
</div>

<script>
// ---------- Tab Navigation Helper ----------
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.querySelectorAll('.tab-button').forEach(tb => {
    tb.classList.remove('active');
    tb.setAttribute('aria-selected', 'false');
  });
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  if (tabId === 'tab-saved') renderSaved();
}

// ---------- Defaults ----------
const DEFAULT_CONFIG = {
  settings: {
    pmWeeksPerYear: 52,        // weekly activities x this
    studentWeeksPerYear: 48,   // student hrs/wk = total hours / this
    fullTimeHours: 2080,       // FTE % = total hours / this
    subawardRate: 0.05,        // multiplier added per subaward
    budgetRatePer100k: 0.03,   // multiplier added per $100k of budget
    multiplierCap: 2           // multiplier max cap
  },
  activities: [
    { id: 'monitoring', name: 'Monitoring project activities & workflow', description: 'Tracks project workflows, maintains work plans/deliverable logs, follows up on assigned tasks, and ensures activities stay on schedule.', hours: 2.5, unit: 'week', timesPerYear: '' },
    { id: 'meeting_coord', name: 'Meeting coordination & facilitation', description: 'Schedules and facilitates project meetings, prepares agendas, gathers status updates, and tracks action items.', hours: 2.5, unit: 'week', timesPerYear: '' },
    { id: 'communication', name: 'Communication & stakeholder engagement', description: 'Manages internal and external communications, distributes meeting documentation, and provides routine status summaries.', hours: 2, unit: 'week', timesPerYear: '' },
    { id: 'budget_monitoring', name: 'Budget monitoring & oversight', description: 'Provides financial oversight by tracking expenditures, reconciling budgets, coordinating with SPARC/sponsors, and supporting hiring/purchases.', hours: 5.5, unit: 'month', timesPerYear: '' },
    { id: 'reporting', name: 'Annual reporting & compliance', description: 'Coordinates sponsor reporting by collecting data, compiling report sections, and ensuring on-time deliverable submissions.', hours: 20, unit: 'year', timesPerYear: '' },
    { id: 'quarterly_report', name: 'Quarterly progress report', description: 'Drafts and submits quarterly progress reports, tracking sub-deliverables and sponsor-required milestones.', hours: 6, unit: 'each', timesPerYear: 4 },
    { id: 'doc_management', name: 'Documentation & knowledge management', description: 'Maintains organized shared repositories and manages file version control for project templates and records.', hours: 1, unit: 'week', timesPerYear: '' },
    { id: 'risk_mgmt', name: 'Risk management & issue resolution', description: 'Supports proactive risk management by identifying potential roadblocks, maintaining a risk log, and resolving emerging issues.', hours: 2.5, unit: 'month', timesPerYear: '' },
    { id: 'subaward_coord', name: 'Partner/subaward coordination', description: 'Manages external subcontracts, coordinates partner institution communication, and tracks subrecipient progress and reports.', hours: 3, unit: 'month', timesPerYear: '' },
    { id: 'launch', name: 'Project launch', description: 'Establishes startup tracking tools, prepares kickoff meetings, and coordinates setup with SPARC Post Award.', hours: 8, unit: 'year', timesPerYear: '' },
    { id: 'closeout', name: 'Project closeout', description: 'Oversees project closeout, ensuring final deliverables are submitted, records archived, and closeout memos completed.', hours: 6, unit: 'year', timesPerYear: '' },
    { id: 'evaluation', name: 'Evaluation & continuous improvement', description: 'Coordinates feedback collection, assists external evaluator requests, and refines operational workflows.', hours: 2.5, unit: 'month', timesPerYear: '' }
  ]
};

const UNITS = ['week', 'month', 'year', 'each'];

// ---------- Calculations ----------
function annualHours(a, s) {
  const h = Number(a.hours) || 0;
  if (a.unit === 'week') return h * (Number(s.pmWeeksPerYear) || 52);
  if (a.unit === 'month') return h * 12;
  if (a.unit === 'each') return h * (Number(a.timesPerYear) || 0);
  return h; // year
}

function calculate(config, project) {
  const s = config.settings;
  const chosen = config.activities.filter(a => project.selected.includes(a.id));
  const baseHours = chosen.reduce((sum, a) => sum + annualHours(a, s), 0);
  const budget = Math.max(0, Number(project.budget) || 0);
  const subawards = Math.max(0, Number(project.subawards) || 0);

  const multiplier = Math.min(
    s.multiplierCap || 2,
    1 + (subawards * (s.subawardRate || 0)) + ((budget / 100000) * (s.budgetRatePer100k || 0))
  );
  const totalHours = baseHours * multiplier;

  const fteHours = Number(s.fullTimeHours) || 2080;
  const studentWeeks = Number(s.studentWeeksPerYear) || 48;

  return {
    baseHours,
    multiplier,
    totalHours,
    ftePercent: fteHours > 0 ? (totalHours / fteHours) * 100 : 0,
    studentHoursPerWeek: studentWeeks > 0 ? totalHours / studentWeeks : 0,
    chosenActivities: chosen
  };
}

// ---------- Storage: Apps Script (Sheet) or Browser (localStorage) ----------
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const CONFIG_KEY = 'pmEffort.config';
const PROJECTS_KEY = 'pmEffort.projects';

function gasCall(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}
function lsGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { alert('Could not save in this browser: ' + e); }
}

// Admin config source: 'sheet' (connected Google Sheet) or 'csv' (uploaded CSV / browser storage).
// Saved projects always go to the Sheet when one is connected.
const SOURCE_KEY = 'pmEffort.source';
let source = IS_GAS && lsGet(SOURCE_KEY) !== 'csv' ? 'sheet' : 'csv';

const configStores = {
  sheet: {
    load: () => gasCall('getConfig'),
    save: c => gasCall('saveConfig', c)
  },
  csv: {
    load: async () => lsGet(CONFIG_KEY),
    save: async c => lsSet(CONFIG_KEY, c)
  }
};

const store = IS_GAS ? {
  saveProject: p => gasCall('saveProject', p),
  listProjects: () => gasCall('getSavedProjects')
} : {
  saveProject: async p => lsSet(PROJECTS_KEY, (lsGet(PROJECTS_KEY) || []).concat([p])),
  listProjects: async () => lsGet(PROJECTS_KEY) || []
};
store.loadConfig = () => configStores[source].load();
store.saveConfig = c => configStores[source].save(c);

// ---------- Application Logic ----------
let config = null;
let selected = [];

function copy(x) { return JSON.parse(JSON.stringify(x)); }
function esc(x) {
  return String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function setStatus(msg) { document.getElementById('status').textContent = msg; }

function normalize(c) {
  c = c || {};
  c.settings = c.settings || {};
  for (const k of Object.keys(DEFAULT_CONFIG.settings)) {
    const v = c.settings[k] ?? DEFAULT_CONFIG.settings[k];
    c.settings[k] = Number(v);
  }
  if (Array.isArray(c.activities)) {
    c.activities.forEach(a => {
      const def = DEFAULT_CONFIG.activities.find(d => d.id === a.id || d.name.toLowerCase() === a.name.toLowerCase());
      if (def) {
        if (!a.description) a.description = def.description;
        if (a.hours === undefined || a.hours === null) a.hours = def.hours;
      }
    });
  } else {
    c.activities = copy(DEFAULT_CONFIG.activities);
  }
  return c;
}

function sourceStatus() {
  if (source === 'sheet') return 'Synced with Google Sheet';
  return IS_GAS ? 'Using uploaded CSV (stored in this browser)' : 'Working locally (Browser storage)';
}

async function loadConfig() {
  setStatus('Loading...');
  try {
    let c = await store.loadConfig();
    if (!c || !c.activities || !c.activities.length) {
      c = copy(DEFAULT_CONFIG);
      await store.saveConfig(c);
    }
    config = normalize(c);
    selected = config.activities.map(a => a.id);
    setStatus(sourceStatus());
    renderAll();
  } catch (e) {
    setStatus('Error loading data: ' + e);
  }
  renderSourcePanel();
}

async function init() {
  if (IS_GAS) document.getElementById('jsonTools').style.display = 'none';
  await loadConfig();
  renderSaved();
}

function currentProject() {
  return {
    name: document.getElementById('projName').value || 'Untitled Project',
    budget: Math.max(0, Number(document.getElementById('projBudget').value) || 0),
    subawards: Math.max(0, Number(document.getElementById('projSubawards').value) || 0),
    selected: selected.slice()
  };
}

function renderAll() { renderUser(); renderAdmin(); renderResults(); }

function renderUser() {
  const s = config.settings;
  document.getElementById('userActivities').innerHTML =
    '<div class="table-wrapper"><table><tr><th scope="col" class="checkbox-col" style="width: 45px; text-align: center;">✓</th><th scope="col" style="width: 60%;">Activity & Description</th><th scope="col" style="width: 25%;">Expected</th><th scope="col" style="width: 15%;">Hours/yr</th></tr>' +
    config.activities.map((a, i) => {
      const isSelected = selected.includes(a.id);
      return `<tr id="activity-row-${i}" class="${isSelected ? 'selected-row' : 'unselected-row'}">
        <td class="checkbox-col" style="text-align: center;"><input type="checkbox" aria-label="Select ${esc(a.name)}" style="transform: scale(1.3);" ${isSelected ? 'checked' : ''} onchange="toggle(${i}, this.checked)"></td>
        <td>
          <strong style="font-size: 1rem; color: var(--black);">${esc(a.name)}</strong>
          ${a.description ? `<span class="activity-desc">${esc(a.description)}</span>` : ''}
        </td>
        <td>${esc(a.hours)} hrs/${a.unit === 'each' ? 'each x ' + esc(a.timesPerYear) + '/yr' : esc(a.unit)}</td>
        <td style="font-weight: 600;">${annualHours(a, s).toFixed(1)}</td>
      </tr>`;
    }).join('') + '</table></div>';
}

function renderResults() {
  const r = calculate(config, currentProject());

  document.getElementById('results').innerHTML = `<div class="table-wrapper"><table>
    <tr>
      <td style="width: 70%;">
        <b>Base hours/yr</b>
        <span title="Total calculated hours before applying complexity multipliers" class="tooltip-icon">ⓘ</span>
      </td>
      <td>${r.baseHours.toFixed(1)}</td>
    </tr>
    <tr>
      <td>
        <b>Complexity multiplier</b>
        <span title="Multiplier derived from subawards and project budget" class="tooltip-icon">ⓘ</span>
      </td>
      <td>${r.multiplier.toFixed(2)}x</td>
    </tr>
    <tr style="background-color: #ffe6e6; border-top: 2px solid var(--primary-red);">
      <td style="color: var(--dark-red);"><b>Total Annualized Hours</b></td>
      <td style="color: var(--dark-red); font-size: 1.1em;"><b>${r.totalHours.toFixed(1)}</b></td>
    </tr>
    <tr>
      <td>
        <b>FTE %</b> 
        <span title="Full-Time Equivalent percentage based on ${config.settings.fullTimeHours} annual standard hours" class="tooltip-icon">ⓘ</span>
        <span style="color:#666; font-size:0.85em; font-weight:normal;">(${config.settings.fullTimeHours} hrs/yr)</span>
      </td>
      <td><b>${r.ftePercent.toFixed(1)}%</b></td>
    </tr>
    <tr>
      <td>
        <b>Hours/wk</b> 
        <span title="Weekly hours required for student worker based on ${config.settings.studentWeeksPerYear} active weeks" class="tooltip-icon">ⓘ</span>
        <span style="color:#666; font-size:0.85em; font-weight:normal;">(student, ${config.settings.studentWeeksPerYear} wks)</span>
      </td>
      <td><b>${r.studentHoursPerWeek.toFixed(1)}</b></td>
    </tr>
  </table></div>`;
}

function renderAdmin() {
  document.getElementById('adminActivities').innerHTML =
    '<div class="table-wrapper"><table><tr><th scope="col" style="width: 25%;">Activity Name</th><th scope="col" style="width: 45%;">Description</th><th scope="col" style="width: 10%;">Hours</th><th scope="col" style="width: 10%;">Per</th><th scope="col" style="width: 10%;">Times/yr</th><th scope="col"></th></tr>' +
    config.activities.map((a, i) => `<tr>
      <td><input type="text" aria-label="Activity Name" value="${esc(a.name)}" onchange="editActivity(${i}, 'name', this.value)"></td>
      <td><input type="text" aria-label="Activity Description" value="${esc(a.description || '')}" onchange="editActivity(${i}, 'description', this.value)" placeholder="Activity description"></td>
      <td><input type="number" aria-label="Activity Hours" step="0.5" value="${esc(a.hours)}" onchange="editActivity(${i}, 'hours', Number(this.value))"></td>
      <td><select aria-label="Activity Unit" onchange="editActivity(${i}, 'unit', this.value)">
        ${UNITS.map(u => `<option ${a.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
      </select></td>
      <td><input type="number" aria-label="Times Per Year" value="${esc(a.timesPerYear)}" onchange="editActivity(${i}, 'timesPerYear', this.value)"></td>
      <td><button class="btn-secondary" style="padding: 6px 12px; font-size: 0.85em;" onclick="removeActivity(${i})">Delete</button></td>
    </tr>`).join('') + '</table></div>';

  document.getElementById('adminSettings').innerHTML =
    '<div class="table-wrapper"><table style="max-width: 600px;"><tr><th scope="col" style="width: 60%;">Setting</th><th scope="col" style="width: 40%;">Value</th></tr>' + Object.keys(config.settings).map(k => `<tr>
      <td style="font-weight: 500;">${k}</td>
      <td><input type="number" aria-label="${k}" value="${esc(config.settings[k])}" onchange="editSetting('${k}', this.value)" step="any"></td>
    </tr>`).join('') + '</table></div>';
}

async function renderSaved() {
  const el = document.getElementById('savedProjects');
  try {
    const list = await store.listProjects();
    if (!list || !list.length) {
      el.innerHTML = `
        <div style="padding: 16px 20px; background-color: var(--light-gray); border-radius: 6px; border-left: 4px solid var(--primary-red);">
          <p style="margin: 0 0 6px 0; font-weight: 600; color: var(--black);">No saved projects found.</p>
          <p style="margin: 0; font-size: 0.9em; color: var(--dark-gray);">
            When you save a project, it will appear here for quick loading and will automatically log to the <strong>Projects</strong> tab in your connected Google Sheet.
          </p>
        </div>
      `;
      return;
    }

    el.innerHTML = '<div class="table-wrapper"><table><tr><th>Saved At</th><th>Project Name</th><th>Budget</th><th>Subawards</th><th>Total Hrs</th><th>FTE %</th><th>Actions</th></tr>' +
      list.map(p => `<tr>
        <td>${esc(p.savedAt)}</td>
        <td><strong>${esc(p.name)}</strong></td>
        <td>$${Number(p.budget).toLocaleString()}</td>
        <td>${esc(p.subawards)}</td>
        <td>${(p.totalHours || p.results?.totalHours || 0).toFixed(1)}</td>
        <td>${(p.ftePercent || p.results?.ftePercent || 0).toFixed(1)}%</td>
        <td><button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8em;" onclick="loadProject('${esc(p.name)}', ${p.budget}, ${p.subawards})">Load</button></td>
      </tr>`).join('') + '</table></div>';
  } catch (e) {
    el.innerHTML = '<p style="color: var(--dark-red);">Error loading saved projects: ' + esc(e.message || e) + '</p>';
  }
}

function loadProject(name, budget, subawards) {
  document.getElementById('projName').value = name;
  document.getElementById('projBudget').value = budget;
  document.getElementById('projSubawards').value = subawards;
  switchTab('tab-calculator', document.getElementById('btn-tab-calculator'));
  renderResults();
  setStatus(`Loaded project "${name}".`);
}

// ---------- Actions ----------
function toggle(i, on) {
  const id = config.activities[i].id;
  selected = on ? selected.concat([id]) : selected.filter(x => x !== id);

  const row = document.getElementById(`activity-row-${i}`);
  if (row) {
    row.className = on ? 'selected-row' : 'unselected-row';
  }
  renderResults();
}

function selectAll(on) {
  selected = on ? config.activities.map(a => a.id) : [];
  renderUser(); 
  renderResults();
}

function editActivity(i, field, value) {
  config.activities[i][field] = value;
  renderUser(); 
  renderResults();
}

function addActivity() {
  const id = 'a' + Date.now();
  config.activities.push({ id, name: 'New activity', description: '', hours: 1, unit: 'week', timesPerYear: '' });
  selected.push(id);
  renderAll();
}

function removeActivity(i) {
  const id = config.activities[i].id;
  config.activities.splice(i, 1);
  selected = selected.filter(x => x !== id);
  renderAll();
}

function editSetting(k, value) {
  config.settings[k] = Number(value);
  renderAll();
}

async function saveAdmin() {
  const btn = document.getElementById('btnSaveAdmin');
  btn.disabled = true;
  setStatus('Saving admin changes...');
  try { 
    await store.saveConfig(config); 
    setStatus('Admin changes saved successfully.'); 
  } catch (e) { 
    setStatus('Error saving admin changes: ' + e); 
  } finally {
    btn.disabled = false;
  }
}

async function resetDefaults() {
  if (!confirm('Replace all activities and settings with default values?')) return;
  config = normalize(copy(DEFAULT_CONFIG));
  selected = config.activities.map(a => a.id);
  renderAll();
  await saveAdmin();
}

async function saveProject() {
  const btn = document.getElementById('btnSaveProject');
  btn.disabled = true;
  const p = currentProject();
  const results = calculate(config, p);
  const names = config.activities.filter(a => p.selected.includes(a.id)).map(a => a.name);
  setStatus('Saving project...');
  try {
    await store.saveProject({ ...p, selectedNames: names, results, savedAt: new Date().toLocaleString() });
    setStatus('Project saved successfully.');
    renderSaved();
  } catch (e) { 
    setStatus('Error saving project: ' + e); 
  } finally {
    btn.disabled = false;
  }
}

function exportConfig() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pm-effort-config.json';
  a.click();
}

function importConfig(input) {
  const file = input.files[0];
  if (!file) return;
  file.text().then(async text => {
    try {
      const c = JSON.parse(text);
      if (!Array.isArray(c.activities) || !c.settings) throw new Error('Missing activities or settings structure');
      config = normalize(c);
      selected = config.activities.map(a => a.id);
      renderAll();
      await saveAdmin();
      setStatus('Config imported successfully.');
    } catch (e) { alert('Could not import config: ' + e.message); }
    input.value = '';
  });
}

// ---------- Input Source & CSV ----------
// One CSV holds both activities and settings, distinguished by the "type" column.
// Setting rows use "id" for the setting key and "value" for its value.
const CSV_HEADERS = ['type', 'id', 'name', 'description', 'hours', 'unit', 'timesPerYear', 'value'];

function toggleInputPanel() {
  const panel = document.getElementById('inputPanel');
  panel.hidden = !panel.hidden;
  document.getElementById('btnInput').setAttribute('aria-expanded', String(!panel.hidden));
}

function renderSourcePanel() {
  document.querySelectorAll('input[name=source]').forEach(r => {
    r.checked = r.value === source;
    if (r.value === 'sheet') r.disabled = !IS_GAS;
  });
  document.getElementById('sheetNote').textContent = IS_GAS ? '' : '(not available - open the calculator from Google Sheets)';
  document.getElementById('btnInput').textContent = 'Input: ' + (source === 'sheet' ? 'Google Sheet' : 'CSV');
}

async function setSource(next) {
  if (next === source || (next === 'sheet' && !IS_GAS)) return;
  if (next === 'csv' && !lsGet(CONFIG_KEY)) {
    // Nothing uploaded yet: ask for a file; uploadCsv() switches the source on success.
    renderSourcePanel();
    document.getElementById('csvFile').click();
    return;
  }
  source = next;
  try { localStorage.setItem(SOURCE_KEY, JSON.stringify(next)); } catch (e) { /* remembered for this session only */ }
  await loadConfig();
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch !== '"') field += ch;
      else if (text[i + 1] === '"') { field += '"'; i++; }
      else quoted = false;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row);
      row = []; field = '';
    } else {
      field += ch;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function toCsv(rows) {
  return rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
}

function configToCsv(c) {
  return toCsv([CSV_HEADERS]
    .concat(c.activities.map(a => ['activity', a.id, a.name, a.description, a.hours, a.unit, a.timesPerYear, '']))
    .concat(Object.keys(c.settings).map(k => ['setting', k, '', '', '', '', '', c.settings[k]])));
}

function csvToConfig(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error('The file is empty.');
  const head = rows[0].map(h => h.trim().toLowerCase());
  if (!head.includes('name')) throw new Error('Missing a "name" header column.');
  const get = (r, col) => {
    const i = head.indexOf(col.toLowerCase());
    return i < 0 ? '' : String(r[i] ?? '').trim();
  };
  const isNum = v => v !== '' && !isNaN(Number(v));

  const activities = [];
  const settings = {};
  rows.slice(1).forEach((r, n) => {
    const line = 'Row ' + (n + 2) + ': ';
    const type = get(r, 'type').toLowerCase() || 'activity';
    if (type === 'setting') {
      const key = get(r, 'id');
      if (!(key in DEFAULT_CONFIG.settings)) throw new Error(line + `unknown setting "${key}".`);
      if (!isNum(get(r, 'value'))) throw new Error(line + `setting "${key}" needs a numeric value.`);
      settings[key] = Number(get(r, 'value'));
    } else if (type === 'activity') {
      const name = get(r, 'name');
      const unit = (get(r, 'unit') || 'year').toLowerCase();
      const times = get(r, 'timesPerYear');
      if (!name) throw new Error(line + 'activity is missing a name.');
      if (!isNum(get(r, 'hours'))) throw new Error(line + `"${name}" needs numeric hours.`);
      if (!UNITS.includes(unit)) throw new Error(line + `unit must be one of ${UNITS.join(', ')}.`);
      if (unit === 'each' && !(Number(times) > 0)) throw new Error(line + `"${name}" uses unit "each" and needs timesPerYear.`);
      activities.push({
        id: get(r, 'id') || 'row' + (n + 2),
        name,
        description: get(r, 'description'),
        hours: Number(get(r, 'hours')),
        unit,
        timesPerYear: isNum(times) ? Number(times) : ''
      });
    } else {
      throw new Error(line + `type must be "activity" or "setting", not "${type}".`);
    }
  });

  if (!activities.length) throw new Error('No activity rows found.');
  const dup = activities.find((a, i) => activities.findIndex(b => b.id === a.id) !== i);
  if (dup) throw new Error(`Duplicate activity id "${dup.id}".`);
  // Settings left out of the CSV keep their current values.
  return { activities, settings: { ...(config ? config.settings : DEFAULT_CONFIG.settings), ...settings } };
}

function uploadCsv(input) {
  const file = input.files[0];
  if (!file) return;
  file.text().then(async text => {
    try {
      const c = normalize(csvToConfig(text));
      source = 'csv';
      try { localStorage.setItem(SOURCE_KEY, JSON.stringify('csv')); } catch (e) { /* session only */ }
      await store.saveConfig(c);
      config = c;
      selected = config.activities.map(a => a.id);
      renderAll();
      renderSourcePanel();
      setStatus(`Loaded ${config.activities.length} activities from ${file.name}. ` + sourceStatus());
    } catch (e) { alert('Could not import CSV: ' + e.message); }
    input.value = '';
  });
}

function downloadCsv() {
  const blob = new Blob([configToCsv(config)], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pm-effort-admin.csv';
  a.click();
}

['projName', 'projBudget', 'projSubawards'].forEach(id =>
  document.getElementById(id).addEventListener('input', renderResults));

init();
